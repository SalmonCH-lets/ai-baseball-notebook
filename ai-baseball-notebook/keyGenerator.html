<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>秘密コード (ライセンスキー) 発行ツール | 管理者用</title>
  <style>
    body { font-family: sans-serif; background: #0F172A; color: #F8FAFC; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; }
    .card { background: #1E293B; border: 1px solid #334155; padding: 24px; border-radius: 12px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { color: #00F2FE; margin-bottom: 12px; font-size: 1.3rem; }
    p { font-size: 0.85rem; color: #94A3B8; margin-bottom: 20px; line-height: 1.5; }
    .btn { background: linear-gradient(135deg, #A855F7, #7E22CE); color: #FFF; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; width: 100%; }
    .btn:hover { opacity: 0.9; }
    .result-box { margin-top: 20px; background: #0F172A; border: 1px solid #00F2FE; padding: 16px; border-radius: 8px; font-size: 1.4rem; font-weight: 900; color: #00F2FE; letter-spacing: 2px; user-select: all; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🔑 AI野球ノート ライセンスコード発行</h2>
    <p>BASEやnoteで商品が購入された際、このツールでコードを生成して購入者にメール等で送信してください。</p>

    <button type="button" class="btn" onclick="generateKey()">新しいコードを1秒で生成</button>

    <div id="result" class="result-box">BB-0000-XXXX</div>
    <span style="font-size:0.75rem;color:#64748B;margin-top:8px;display:block;">※クリックでコピーできます</span>
  </div>

  <script>
    const SECRET_SALT = "BASEBALL_AI_2026_SECRET_SALT";

    function generateKey() {
      // 4桁のランダムシリアル (0001 - 9999)
      const serialNum = Math.floor(1000 + Math.random() * 9000).toString();
      
      // 暗号化ハッシュ計算
      const checksum = calcChecksum(serialNum);
      
      const fullKey = `BB-${serialNum}-${checksum}`;
      document.getElementById('result').textContent = fullKey;
    }

    function calcChecksum(serial) {
      let hash = 0;
      const str = serial + SECRET_SALT;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      const hex = Math.abs(hash).toString(36).toUpperCase();
      return (hex + "X7K9").substring(0, 4);
    }
  </script>

</body>
</html>
